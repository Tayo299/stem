spring:
  application:
    name: hssc-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hssc}
    username: ${DATABASE_USERNAME:hssc}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate: 
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
hssc:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:hssc-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  uploads:
    directory: ${UPLOAD_DIRECTORY:./var/uploads}
  exam:
    duration-minutes: ${HSSC_EXAM_DURATION_MINUTES:40}
    marks-per-correct-answer: ${HSSC_EXAM_MARKS_PER_CORRECT_ANSWER:2.5}
  bootstrap:
    admin-email: ${HSSC_ADMIN_EMAIL:}
    admin-password: ${HSSC_ADMIN_PASSWORD:}
    # Format: CODE=District Name|Zone One,Zone Two;CODE2=Another District|Zone A
    district-zones: ${HSSC_DISTRICT_ZONES:}
